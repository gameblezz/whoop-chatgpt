<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHOOP OAuth Callback</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; line-height: 1.6; color: #222; }
    code, pre { background: #f3f4f6; border-radius: 8px; padding: 4px 7px; overflow-wrap: anywhere; }
    pre { padding: 14px; white-space: pre-wrap; }
    .ok { color: #08783e; }
    .err { color: #b42318; }
  </style>
</head>
<body>
  <h1>WHOOP Authorization Callback</h1>
  <p id="status">Reading authorization response…</p>
  <div id="result"></div>
  <script>
    const p = new URLSearchParams(location.search);
    const code = p.get('code');
    const state = p.get('state');
    const error = p.get('error');
    const status = document.getElementById('status');
    const result = document.getElementById('result');

    if (error) {
      status.textContent = 'WHOOP returned an authorization error.';
      status.className = 'err';
      result.innerHTML = '<pre>' + String(error).replace(/[&<>]/g, '') + '</pre>';
    } else if (code) {
      status.textContent = 'Authorization code received successfully.';
      status.className = 'ok';
      const safeCode = code.replace(/[&<>]/g, '');
      const safeState = (state || '').replace(/[&<>]/g, '');
      result.innerHTML =
        '<p>Authorization code:</p><pre id="code"></pre>' +
        (safeState ? '<p>State:</p><pre id="state"></pre>' : '') +
        '<p>You can now return to the setup flow. Do not publish your Client Secret or access/refresh tokens.</p>';
      document.getElementById('code').textContent = safeCode;
      if (safeState) document.getElementById('state').textContent = safeState;
    } else {
      status.textContent = 'No authorization code was found in the URL.';
      result.innerHTML = '<p>This page is the registered OAuth callback for the personal WHOOP integration.</p>';
    }
  </script>
</body>
</html>
